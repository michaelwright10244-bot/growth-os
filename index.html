      ],

    let shared=null;try{if(location.hash.startsWith('#resume='))shared=JSON.parse(decodeURIComponent(location.hash.slice(8)))}catch{}const saved=localStorage.getItem(storeKey);const state=shared?{...structuredClone(seed),profile:shared.profile&&typeof shared.profile==='object'?{...seed.profile,...shared.profile}:seed.profile,projects:Array.isArray(shared.projects)?shared.projects.filter(p=>p&&typeof p==='object'):[],materials:[],reviews:[],commits:[]}:saved?JSON.parse(saved):structuredClone(seed);if(!Array.isArray(state.commits))state.commits=[];state.page=shared||location.hash==='#resume'?'resume':'overview';state.dialog=null;state.choice='经历';state.targetProjectId=null;

    const btn=(label,action,kind='ghost',extra='')=>`<button class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`;
    const projectById=id=>state.projects.find(p=>p.id===id);

    const navBtn=x=>{const badge=x[0]==='library'?state.materials.length:x[0]==='review'?state.reviews.length:'';return `<button class="${state.page===x[0]?'active':''}" data-nav="${x[0]}"><span><i class="mark">${x[2]}</i>${x[1]}</span>${badge?`<b class="badge">${badge}</b>`:''}</button>`};
    function side(){return `<aside class="sidebar"><div class="brand"><i>职</i><div>职业操作系统<small>CAREER OS / PRIVATE</small></div></div><p class="nav-label">职业资产</p><nav class="nav">${nav.slice(0,5).map(navBtn).join('')}</nav><p class="nav-label">资料与决策</p><nav class="nav">${nav.slice(5).map(navBtn).join('')}</nav><div class="sidebar-foot"><button data-action="settings">设置与导出</button><br />资料来源始终可追溯</div></aside>`}
    function right(){const publicCount=state.projects.filter(p=>p.public).length;return `<aside class="rightbar"><div class="right-head"><h2>当前工作台</h2><span>本地保存</span></div><section class="panel inbox"><h3>职业资料收件箱</h3><p>先保留来源，再关联项目。每一条资料都可以成为将来的面试证据。</p><div class="inbox-count"><b>${String(state.materials.length).padStart(2,'0')}</b><span>条已留存资料</span></div><div class="sources"><span>外部笔记</span><span>项目文档</span><span>代码仓库</span><span>本地文件</span></div>${btn('添加一条资料','open-chooser','primary')}</section><section class="panel"><h3>对外展示</h3><p><b>${publicCount}</b> 个项目已明确设为可展示，会自动进入电子简历。</p>${btn('查看电子简历','resume','outline')}</section><section class="panel hint"><p>“资料被关联到项目，并选择公开后，才会成为可展示的职业证据。”</p><small>隐私默认关闭，展示由你决定</small></section></aside>`}
    function overview(){const publicCount=state.projects.filter(p=>p.public).length;return `<section class="profile card"><div><div class="eyebrow"><i></i>我的职业档案</div><h1>让每一份经历，成为你的<em>职业地图</em>。</h1><p>这里把项目、笔记和资料连接成“我是谁、做过什么、会什么、下一步去哪”的职业工作台；原始资料仍保留在你原本的位置。</p></div><div class="identity"><span>CURRENT IDENTITY</span><b>${esc(state.profile.name)}</b><small>${esc(state.profile.headline)}</small></div></section><section><div class="title-row"><div><h2>从项目到面试展示</h2><p>这条链路是后续所有项目接入平台的统一入口。</p></div>${btn('新建项目','open-project','primary')}</div><div class="flow"><article class="flow-step"><strong>01. 建一个项目</strong><p>写清背景、目标和你的职责，不需要一次写完。</p></article><i class="flow-arrow">→</i><article class="flow-step"><strong>02. 关联过程资料</strong><p>笔记、文档、仓库和结果都回到该项目，保留来源。</p></article><i class="flow-arrow">→</i><article class="flow-step"><strong>03. 选择公开展示</strong><p>确认可展示后，项目自动进入电子简历和面试页。</p></article></div></section><section><div class="title-row"><div><h2>正在沉淀的项目</h2><p>项目是职业故事的骨架，不是待办清单。</p></div>${btn('项目中心 →','projects')}</div><section class="card list-card">${projectList(state.projects.slice(0,3))}</section></section><section class="grid-3" style="margin-top:14px"><article class="card stat"><b>${state.projects.length}</b><span>个项目档案</span><p>每个项目都能接收新资料与结果。</p></article><article class="card stat"><b>${state.materials.length}</b><span>条来源资料</span><p>资料仍可回到原始出处验证。</p></article><article class="card stat"><b>${publicCount}</b><span>个可展示案例</span><p>仅它们会出现在电子简历中。</p></article></section>`}
    function projectList(items){return items.length?items.map(p=>`<article class="project"><i class="dot ${p.public?'':'private'}"></i><div><h3>${esc(p.name)}</h3><p>${esc(p.goal)} · ${evidence(p.id)} 条过程资料</p><div class="project-meta"><span class="tag ${p.public?'':'private'}">${p.public?'可展示':'私密'}</span><span class="tag">${esc(p.status)}</span></div></div><button data-action="detail:${p.id}">打开 →</button></article>`).join(''):`<div class="empty"><h2>还没有项目</h2><p>从一个正在做或已经做完的项目开始。</p>${btn('新建项目','open-project','primary')}</div>`}
    function projects(){const active=state.projects.filter(p=>p.status!=='待整理');const backlog=state.projects.filter(p=>p.status==='待整理');return `<div class="title-row"><div><h1>项目中心</h1><p>每个新项目在这里建立入口，再接住过程资料、结果和可展示版本。</p></div>${btn('+ 新建项目','open-project','primary')}</div><div class="grid-2"><section class="card list-card"><h2>正在推进</h2>${projectList(active)}</section><section class="card list-card"><h2>待整理 / 私密项目</h2>${projectList(backlog)}</section></div><section class="card list-card" style="margin-top:14px"><h2>接入一个新项目，只需三步</h2><div class="topic-list"><div class="topic-row"><div><b>先建立项目档案</b><small>名称、目标和你的职责就是最小信息。</small></div>${btn('新建','open-project','outline')}</div><div class="topic-row"><div><b>再补充过程资料</b><small>在项目详情中添加笔记、链接、代码仓库或结果。</small></div></div><div class="topic-row"><div><b>最后决定是否公开</b><small>公开后进入电子简历；默认私密，不会意外展示。</small></div></div></div></section>`}
    function detail(id){state.targetProjectId=id;const p=projectById(id);if(!p)return overview();const materials=state.materials.filter(m=>m.projectId===id);return `<div class="title-row"><div><h1>${esc(p.name)}</h1><p>${esc(p.summary||p.goal)}</p></div><div>${btn('补充资料','open-chooser','outline')} ${btn(p.public?'从简历移除':'加入电子简历',`toggle-public:${p.id}`,'primary')}</div></div><div class="grid-2"><section class="card list-card"><h2>项目档案</h2><div class="topic-list"><div class="topic-row"><div><b>背景与目标</b><small>${esc(p.goal)}</small></div></div><div class="topic-row"><div><b>我的职责</b><small>${esc(p.role)}</small></div></div><div class="topic-row"><b>当前状态</b><span>${esc(p.status)}</span></div><div class="topic-row"><b>展示状态</b><span class="tag ${p.public?'':'private'}">${p.public?'可展示，已进入电子简历':'私密，不会对外展示'}</span></div></div></section><section class="card list-card"><h2>项目证据</h2><div class="topic-list"><div class="topic-row"><b>过程资料</b><span>${materials.length} 条已关联</span></div><div class="topic-row"><b>可写入简历的结果</b><span>${p.outcomes.length?p.outcomes.length+' 条':'待补充'}</span></div><div class="topic-row"><b>可公开性</b><button data-action="toggle-public:${p.id}">${p.public?'设为私密':'设为可展示'} →</button></div></div></section></div><section class="card list-card" style="margin-top:14px"><div class="title-row"><div><h2>关联资料</h2><p>每条资料保留来源，不复制或替代原始资料库。</p></div>${btn('补充资料','open-chooser','outline')}</div>${materials.length?projectMaterials(materials):`<div class="empty"><h2>还没有过程资料</h2><p>补一条笔记、链接或验证结果，让项目有据可查。</p>${btn('添加资料','open-chooser','primary')}</div>`}</section>`}
    const projectMaterials=items=>items.map(m=>`<article class="project"><i class="dot"></i><div><h3>${esc(m.title)}</h3><p>${esc(m.source)} · ${esc(m.permission)}</p></div><span class="tag">已关联</span></article>`).join('');
    function resume(){const publicProjects=state.projects.filter(p=>p.public);return `<div class="title-row"><div><h1>电子简历</h1><p>只汇总你已确认公开的项目；这里是可直接给面试官看的精简版本。</p></div><div>${btn('编辑个人信息','open-profile','outline')} ${btn('复制展示链接','copy-resume','outline')} ${btn('打印 / 存为 PDF','print-resume','primary')}</div></div><section class="resume-shell" id="resume-content"><header class="resume-head"><div><div class="resume-kicker">CAREER OS / INTERVIEW PROFILE</div><h1>${esc(state.profile.name)}</h1><p>${esc(state.profile.headline)}</p></div><div class="resume-contact">${esc(state.profile.contact).replace(/\n/g,'<br />')}</div></header><div class="resume-body"><section class="resume-section"><h2>PROFILE</h2><p class="resume-summary">${esc(state.profile.summary)}</p></section><section class="resume-section"><h2>SELECTED PROJECTS / ${publicProjects.length}</h2>${publicProjects.length?publicProjects.map(p=>`<article class="resume-project"><time>${esc(p.period)}</time><div><h3>${esc(p.name)}</h3><p><b>目标：</b>${esc(p.goal)}<br /><b>职责：</b>${esc(p.role)}</p>${p.outcomes.length?`<ul>${p.outcomes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div></article>`).join(''):`<div class="empty"><h2>还没有公开项目</h2><p>在项目详情中点击“加入电子简历”，这里会自动更新。</p></div>`}</section><section class="resume-section"><h2>CAPABILITIES</h2><div class="resume-skills"><span>提示词与行为约束</span><span>Agent 工作流</span><span>Vibe Coding 实践</span><span>AI 应用工程</span></div></section></div></section><div class="share-note"><b>展示边界</b><span>展示链接只携带你选择公开的项目和简历信息；任何拿到链接的人都能看到这些内容。</span></div>`}
    function careerGit(){const commits=state.commits.map(c=>`<article class="project"><i class="dot"></i><div><h3>${esc(c.title)}</h3><p>${esc(c.before)} → ${esc(c.after)}</p><div class="project-meta"><span class="tag">${esc(c.date)}</span><span class="tag">${esc(projectById(c.projectId)?.name||'未关联项目')}</span></div></div></article>`).join('');return `<div class="title-row"><div><h1>职业 Git</h1><p>代码 Git 记录代码变化；这里记录你因为真实实践而产生的能力变化。</p></div>${btn('+ 记录一次能力提交','open-commit','primary')}</div><div class="grid-2"><section class="card list-card"><h2>提交记录</h2>${commits||'<div class="empty"><h2>还没有提交</h2><p>在一个项目中做出新判断、掌握新方法或验证新结果时，记录一次变化。</p></div>'}</section><section class="card list-card"><h2>什么值得提交？</h2><div class="topic-list"><div class="topic-row"><div><b>能力有了可说清的变化</b><small>不是“学了什么”，而是“从不会到会、从猜到能验证”。</small></div></div><div class="topic-row"><div><b>能关联到一个项目</b><small>项目和资料就是这次提交的证据，不做空泛自评。</small></div></div><div class="topic-row"><div><b>一次提交只记录一个变化</b><small>像 Git 一样小而清晰，之后才能回看成长轨迹。</small></div></div></div></section></div>`}
    function capabilities(){return `<div class="title-row"><div><h1>能力地图</h1><p>能力不是自评标签；每个主题都需要关联项目、资料与可验证的结论。</p></div></div><section class="card list-card"><div class="topic-list">${[['提示词与行为约束','销售 Agent 稳定性优化'],['Agent 工作流','状态控制与流程迭代'],['Vibe Coding 实践','说人话工具等项目'],['AI 应用工程','RAG Demo 与工程实践']].map(x=>`<div class="topic-row"><div><b>${x[0]}</b><small>${x[1]}</small></div><button data-action="projects">查看关联项目 →</button></div>`).join('')}</div></section>`}
    function library(){return `<div class="title-row"><div><h1>职业资料收件箱</h1><p>先保留来源，再决定它属于哪个项目、能力主题或职业计划。</p></div>${btn('添加职业资料','open-chooser','primary')}</div><section class="card list-card"><div class="topic-list">${state.materials.map(m=>`<div class="topic-row"><div><b>${esc(m.title)}</b><small>${esc(m.source)} · ${projectById(m.projectId)?.name||'待归类'} · ${esc(m.permission)}</small></div><button data-action="detail:${m.projectId}">查看项目 →</button></div>`).join('')}</div></section>`}
    function review(){const cards=state.reviews.map(r=>`<article class="card list-card" style="margin-bottom:12px"><h2>${esc(r.title)}</h2><p style="color:var(--soft);font-size:11px">${esc(r.text)}</p><div class="share-note">${esc(r.source)}</div><div style="margin-top:12px"><button class="btn danger" data-action="reject:${r.id}">拒绝</button><button class="btn primary" data-action="confirm:${r.id}">确认沉淀</button></div></article>`).join('');return `<div class="title-row"><div><h1>待审核</h1><p>AI 只能生成草稿；确认、编辑或拒绝始终由你决定。</p></div></div>${cards||'<section class="card empty"><h2>没有待审核草稿</h2><p>原始资料仍完整保留在收件箱与项目中。</p></section>'}`}
    function settings(){return `<div class="title-row"><div><h1>设置与导出</h1><p>本版本将你的项目、资料和简历内容保存在当前浏览器。</p></div></div><section class="card list-card"><div class="topic-list"><div class="topic-row"><b>存储位置</b><span>浏览器本地存储</span></div><div class="topic-row"><b>导出数据</b><button data-action="export-json">下载 JSON →</button></div><div class="topic-row"><b>恢复演示数据</b><button data-action="reset-demo">重置 →</button></div></div></section>`}
    function render(){const bodies={overview,projects,resume,capabilities,git:careerGit,library,review,settings,detail:()=>detail(state.detailId)};const body=bodies[state.page]?.()||overview();const info=pageInfo[state.page]||pageInfo.overview;document.querySelector('#app').innerHTML=`<div class="app">${side()}<main class="main"><header class="main-top"><span class="crumb">${info[0]}</span><div class="actions">${btn('导入资料','open-chooser','outline')}${btn('+ 添加资料','open-chooser','primary')}</div></header>${body}</main>${right()}</div>`;bind()}
    function showToast(message){document.querySelector('#toast span').textContent=message;const toast=document.querySelector('#toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}

    function act(action){const [kind,id]=action.split(':');if(action==='open-chooser'){state.dialog='chooser';renderDialog()}else if(action==='open-project'){state.dialog='project';renderDialog()}else if(action==='open-profile'){state.dialog='profile';renderDialog()}else if(action==='open-commit'){state.dialog='commit';renderDialog()}else if(['overview','projects','resume','capabilities','git','library','review','settings'].includes(action)){state.targetProjectId=null;state.page=action;location.hash=action==='resume'?'resume':'';render()}else if(kind==='detail'){state.page='detail';state.detailId=id;render()}else if(kind==='toggle-public'){const p=projectById(id);p.public=!p.public;save();showToast(p.public?'项目已加入电子简历。':'项目已改为私密，不再对外展示。');render()}else if(kind==='confirm'||kind==='reject'){state.reviews=state.reviews.filter(r=>r.id!==Number(id));save();showToast(kind==='confirm'?'草稿已确认并沉淀。':'草稿已拒绝，原始资料保持不变。');render()}else if(action==='copy-resume'){const share={profile:state.profile,projects:state.projects.filter(p=>p.public)};const url=`${location.origin}${location.pathname}#resume=${encodeURIComponent(JSON.stringify(share))}`;navigator.clipboard?.writeText(url).then(()=>showToast('展示链接已复制。')).catch(()=>showToast('浏览器未授权复制，请手动复制地址。'))}else if(action==='print-resume'){window.print()}else if(action==='export-json'){const blob=new Blob([JSON.stringify({profile:state.profile,projects:state.projects,materials:state.materials,commits:state.commits},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='career-os-export.json';link.click();URL.revokeObjectURL(link.href);showToast('已导出当前职业资产。')}else if(action==='reset-demo'){localStorage.removeItem(storeKey);location.reload()}}
    function renderDialog(){const root=document.querySelector('#dialogs');document.querySelector('#backdrop').classList.toggle('open',!!state.dialog);if(!state.dialog){root.innerHTML='';return}if(state.dialog==='chooser'){root.innerHTML=`<section class="dialog open"><div class="dialog-head"><div><h2>添加职业资料</h2><p>先保留来源，关联项目可以稍后补。</p></div><button class="close" data-close>×</button></div><div class="choices">${[['经历','记录工作过程、判断、结果或复盘。'],['资料','导入项目文档、Prompt、代码、笔记或链接。'],['想法','留下一段方向判断或待验证计划。']].map((x,i)=>`<button class="choice" data-choice="${x[0]}"><i>0${i+1}</i><b>${x[0]==='经历'?'记录一段经历':x[0]==='资料'?'导入资料或链接':'添加职业想法'}</b><small>${x[1]}</small></button>`).join('')}</div></section>`}else if(state.dialog==='project'){root.innerHTML=`<section class="dialog open"><div class="dialog-head"><div><h2>新建项目</h2><p>这是项目接入职业操作系统的入口。先写最小信息，资料和结果之后补。</p></div><button class="close" data-close>×</button></div><form class="form" id="project-form"><label>项目名称<input name="name" required placeholder="例如：客户问答 Agent" /></label><label>背景与目标<textarea name="goal" required placeholder="要解决什么问题，或想验证什么？"></textarea></label><label>我的职责<input name="role" required placeholder="例如：设计流程、开发原型、验证效果" /></label><div class="form-row"><label>当前状态<select name="status"><option>进行中</option><option>已完成</option><option>待整理</option></select></label><label>展示状态<select name="public"><option value="false">默认私密</option><option value="true">可展示，进入电子简历</option></select></label></div><div class="form-foot">${btn('取消','close-dialog','ghost')}${btn('创建项目','submit-project','primary')}</div></form></section>`}else if(state.dialog==='profile'){root.innerHTML=`<section class="dialog open"><div class="dialog-head"><div><h2>编辑电子简历</h2><p>这里的内容只出现在电子简历中。</p></div><button class="close" data-close>×</button></div><form class="form" id="profile-form"><label>职业身份<input name="name" required value="${esc(state.profile.name)}" /></label><label>能力标签<input name="headline" required value="${esc(state.profile.headline)}" /></label><label>个人介绍<textarea name="summary" required>${esc(state.profile.summary)}</textarea></label><label>联系方式或作品链接<textarea name="contact">${esc(state.profile.contact)}</textarea></label><div class="form-foot">${btn('取消','close-dialog','ghost')}${btn('保存简历','submit-profile','primary')}</div></form></section>`}else{const projectOptions=state.projects.map(p=>`<option value="${p.id}" ${p.id===state.targetProjectId?'selected':''}>${esc(p.name)}</option>`).join('');const prompts={经历:['记录一段经历','这段经历是什么？','例如：我给销售 Agent 补了状态约束，重复追问减少了。'],资料:['导入资料或链接','这份资料是什么，为什么值得留？','例如：一份历史项目方案，记录了职责、方案选择和交付结果。'],想法:['添加职业想法','你在考虑什么？','例如：我想从提示词工程进一步走向 AI 应用工程。']}[state.choice];root.innerHTML=`<section class="dialog open"><div class="dialog-head"><div><h2>${prompts[0]}</h2><p>保存后会留在收件箱，并关联到你选择的项目。</p></div><button class="close" data-close>×</button></div><form class="form" id="material-form"><label>${prompts[1]}<textarea name="title" required placeholder="${prompts[2]}"></textarea></label><div class="form-row"><label>关联项目<select name="projectId"><option value="">职业资料收件箱（稍后整理）</option>${projectOptions}</select></label><label>资料来源<select name="source"><option>手工记录</option><option>外部笔记</option><option>项目文档</option><option>代码仓库</option><option>本地文件</option></select></label></div><label>AI 使用许可<select name="permission"><option>允许 AI 整理</option><option>禁止 AI 使用</option></select></label><div class="form-foot">${btn('返回','dialog-back','ghost')}${btn('进入职业收件箱','submit-material','primary')}</div></form></section>`}root.querySelectorAll('[data-close],[data-action="close-dialog"]').forEach(b=>b.onclick=closeDialog);root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.choice=b.dataset.choice;state.dialog='material';renderDialog()});const back=root.querySelector('[data-action="dialog-back"]');if(back)back.onclick=()=>{state.dialog='chooser';renderDialog()};const projectForm=root.querySelector('#project-form');if(projectForm)projectForm.onsubmit=e=>{e.preventDefault();const f=new FormData(projectForm);const id=`project-${Date.now()}`;state.projects.unshift({id,name:f.get('name').trim(),goal:f.get('goal').trim(),role:f.get('role').trim(),status:f.get('status'),public:f.get('public')==='true',evidence:0,period:'2026 / 新建',summary:f.get('goal').trim(),outcomes:[]});state.dialog=null;save();renderDialog();state.page='detail';state.detailId=id;render();showToast('项目已建立，现在可以补充资料。')};const materialForm=root.querySelector('#material-form');if(materialForm)materialForm.onsubmit=e=>{e.preventDefault();const f=new FormData(materialForm);state.materials.unshift({id:`material-${Date.now()}`,title:f.get('title').trim(),source:f.get('source'),projectId:f.get('projectId'),permission:f.get('permission')});state.dialog=null;save();renderDialog();render();showToast(f.get('projectId')?'资料已关联到项目。':'资料已进入收件箱。')};const profileForm=root.querySelector('#profile-form');if(profileForm)profileForm.onsubmit=e=>{e.preventDefault();const f=new FormData(profileForm);state.profile={name:f.get('name').trim(),headline:f.get('headline').trim(),summary:f.get('summary').trim(),contact:f.get('contact').trim()};state.dialog=null;save();renderDialog();render();showToast('电子简历已更新。')}}
    function renderCommitDialog(){const root=document.querySelector('#dialogs');const options=state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');document.querySelector('#backdrop').classList.toggle('open',true);root.innerHTML=`<section class="dialog open"><div class="dialog-head"><div><h2>记录一次能力提交</h2><p>像 Git 一样，写下一个可回看的小变化，并关联它的项目证据。</p></div><button class="close" data-close>×</button></div><form class="form" id="commit-form"><label>提交说明<input name="title" required placeholder="例如：feat(agent): 增加状态约束" /></label><div class="form-row"><label>变化前<textarea name="before" required placeholder="之前处于什么状态？"></textarea></label><label>变化后<textarea name="after" required placeholder="现在能做什么，或验证了什么？"></textarea></label></div><label>关联项目<select name="projectId" required>${options}</select></label><div class="form-foot">${btn('取消','close-dialog','ghost')}${btn('提交能力变化','submit-commit','primary')}</div></form></section>`;root.querySelectorAll('[data-close],[data-action="close-dialog"]').forEach(b=>b.onclick=closeDialog);const form=root.querySelector('#commit-form');form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);state.commits.unshift({id:`commit-${Date.now()}`,title:f.get('title').trim(),before:f.get('before').trim(),after:f.get('after').trim(),projectId:f.get('projectId'),date:new Date().toISOString().slice(0,10).replaceAll('-','.')});state.dialog=null;save();renderDialog();state.page='git';render();showToast('能力变化已提交到职业 Git。')}}
    const baseRenderDialog=renderDialog;renderDialog=()=>state.dialog==='commit'?renderCommitDialog():baseRenderDialog();
    function closeDialog(){state.dialog=null;renderDialog()}document.querySelector('#backdrop').onclick=closeDialog;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});render();
  </script>
</body>
</html>
